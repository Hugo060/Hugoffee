<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Hugoffee</title>
    <link rel="icon" id="logo" href="/Imagenes/logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="/css/modoOscuro.css" />
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Crea tu cuenta</h2>
                <p>Únete a Hugoffee y disfruta de nuestros productos</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regName">Nombre completo</label>
                    <input type="text" id="regName" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="regEmail">Correo electrónico</label>
                    <input type="email" id="regEmail" placeholder="ejemplo@email.com" required>
                </div>

                <div class="form-group">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-auth">Crear Cuenta</button>
            </form>

            <div class="auth-footer">
                <p>¿Ya tienes cuenta? <a href="inicioSesion.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
